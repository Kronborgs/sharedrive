stages:
  - test
  - build
  - publish

variables:
  GO_VERSION: "1.25.0"
  NODE_VERSION: "22"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

default:
  interruptible: true

backend:test:
  stage: test
  image: golang:${GO_VERSION}
  cache:
    key:
      files:
        - backend/go.sum
    paths:
      - .cache/go-build
      - go/pkg/mod
  variables:
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
    GOMODCACHE: $CI_PROJECT_DIR/go/pkg/mod
  before_script:
    - cd backend
  script:
    - go test ./... -timeout 60s

backend:build:
  stage: build
  image: golang:${GO_VERSION}
  cache:
    key:
      files:
        - backend/go.sum
    paths:
      - .cache/go-build
      - go/pkg/mod
  variables:
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
    GOMODCACHE: $CI_PROJECT_DIR/go/pkg/mod
    CGO_ENABLED: "0"
  before_script:
    - cd backend
  script:
    - mkdir -p bin
    - go build -o bin/server ./cmd/server
  artifacts:
    paths:
      - backend/bin/server
    expire_in: 7 days

frontend:build:
  stage: build
  image: node:${NODE_VERSION}
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
  before_script:
    - cd frontend
    - npm install
  script:
    - npm run type-check
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 7 days

docker:publish:
  stage: publish
  image: docker:27
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --pull -t "$CI_REGISTRY_IMAGE:latest" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"