services:

  app:
    image: ghcr.io/kronborgs/sharedrive:latest
    container_name: sharedrive
    restart: unless-stopped
    volumes:
      - /mnt/user/files/sharedrive:/data/files:rw
      - /mnt/user/backups/sharedrive:/data/backups:rw
      - /mnt/user/appdata/sharedrive/preview-cache:/data/preview-cache:rw
    environment:
      TZ: ${TZ:-Europe/Copenhagen}
      APP_BASE_URL: ${APP_BASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      POSTGRES_HOST: sharedrive-postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-privatedrive}
      POSTGRES_USER: ${POSTGRES_USER:-privatedrive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      REDIS_ADDR: sharedrive-redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      BACKUP_HMAC_SECRET: ${BACKUP_HMAC_SECRET}
      TOTP_ENCRYPT_KEY: ${TOTP_ENCRYPT_KEY}
      DEVICE_TRUST_SECRET: ${DEVICE_TRUST_SECRET}
      GOTENBERG_URL: http://sharedrive-gotenberg:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - sharedrive-net
      - cloudflare   # shared Cloudflare tunnel network on Unraid

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: sharedrive-gotenberg
    restart: unless-stopped
    command:
      - gotenberg
      - --libreoffice-restart-after=10
      - --api-timeout=60s
      - --log-level=warn
    networks:
      - sharedrive-net

  postgres:
    image: postgres:16-alpine
    container_name: sharedrive-postgres
    restart: unless-stopped
    volumes:
      - /mnt/user/appdata/sharedrive/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-privatedrive}
      POSTGRES_USER: ${POSTGRES_USER:-privatedrive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-privatedrive}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sharedrive-net

  redis:
    image: redis:7-alpine
    container_name: sharedrive-redis
    restart: unless-stopped
    command: >
      redis-server
        --save ""
        --appendonly no
        --maxmemory 128mb
        --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - sharedrive-net

  watchtower:
    image: containrrr/watchtower
    container_name: sharedrive-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro  # ghcr.io credentials
    environment:
      WATCHTOWER_POLL_INTERVAL: 300          # check every 5 minutes
      WATCHTOWER_CLEANUP: "true"             # remove old images
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_SCOPE: sharedrive           # only watch our containers
    command: sharedrive                      # only update the app container

networks:
  sharedrive-net:
    driver: bridge
  cloudflare:
    external: true
    name: ${CLOUDFLARE_NETWORK_NAME:-cloudflare}
