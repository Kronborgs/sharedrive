<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sharedrive — self-hosted private file drive" />
    <title>Sharedrive</title>

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- PWA / Web App Manifest -->
    <script>
      const isNotesApp = location.pathname === '/notes' || location.pathname.startsWith('/notes/')
      const manifest = document.createElement('link')
      manifest.id = 'app-manifest'
      manifest.rel = 'manifest'
      manifest.href = isNotesApp ? '/notes.webmanifest' : '/site.webmanifest'
      document.head.appendChild(manifest)
    </script>
    <meta name="theme-color" content="#1a8cd8" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sharedrive" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
