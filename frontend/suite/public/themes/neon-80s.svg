<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Himmelfarve: dyb midnatslilla til varm magenta horisont -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060213" />
      <stop offset="28%" stop-color="#12052b" />
      <stop offset="52%" stop-color="#240945" />
      <stop offset="64%" stop-color="#4a115e" />
      <stop offset="70%" stop-color="#7a1b68" />
    </linearGradient>

    <!-- Blød horisont-halo bag solen -->
    <radialGradient id="horizonGlow" cx="50%" cy="68%" r="46%" fx="50%" fy="68%">
      <stop offset="0%" stop-color="#ff2e93" stop-opacity="0.52" />
      <stop offset="40%" stop-color="#a21caf" stop-opacity="0.28" />
      <stop offset="75%" stop-color="#3b0764" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#060213" stop-opacity="0" />
    </radialGradient>

    <!-- Ekstra radial cyan-glød lavt langs horisonten -->
    <radialGradient id="cyanHorizonGlow" cx="50%" cy="68.5%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.34" />
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#060213" stop-opacity="0" />
    </radialGradient>

    <!-- Retro-solens egen varme gradient -->
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="30%" stop-color="#ff8a4c" />
      <stop offset="68%" stop-color="#ff3d81" />
      <stop offset="100%" stop-color="#b5179e" />
    </linearGradient>

    <!-- Glødende halo tæt omkring solen -->
    <radialGradient id="sunHalo" cx="50%" cy="50%" r="50%">
      <stop offset="45%" stop-color="#ff4d8d" stop-opacity="0.45" />
      <stop offset="75%" stop-color="#d946ef" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#7a1b68" stop-opacity="0" />
    </radialGradient>

    <!-- Gulvets mørke synthwave-flade -->
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14062b" />
      <stop offset="35%" stop-color="#0b031c" />
      <stop offset="100%" stop-color="#050110" />
    </linearGradient>

    <!-- Elektrisk cyan-til-magenta gittergradient -->
    <linearGradient id="gridColorGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Dæmper gitterets intensitet helt tæt ved horisonten og i kanten -->
    <linearGradient id="gridVertFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.92" />
      <stop offset="28%" stop-color="#38bdf8" stop-opacity="0.72" />
      <stop offset="68%" stop-color="#a855f7" stop-opacity="0.62" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.55" />
    </linearGradient>

    <!-- Horisontlinjens stærke neon-linje -->
    <linearGradient id="horizonLineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.15" />
      <stop offset="22%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#a5f3fc" stop-opacity="1" />
      <stop offset="78%" stop-color="#f472b6" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.15" />
    </linearGradient>

    <!-- Segmenteret scanline-maske på retro-solen -->
    <mask id="sunScanlineMask">
      <rect x="650" y="250" width="620" height="580" fill="#ffffff" />
      <!-- Horisontale udskæringer i solens nederste halvdel -->
      <rect x="650" y="518" width="620" height="5" fill="#000000" />
      <rect x="650" y="544" width="620" height="7" fill="#000000" />
      <rect x="650" y="572" width="620" height="10" fill="#000000" />
      <rect x="650" y="603" width="620" height="13" fill="#000000" />
      <rect x="650" y="637" width="620" height="16" fill="#000000" />
      <rect x="650" y="674" width="620" height="20" fill="#000000" />
      <rect x="650" y="714" width="620" height="24" fill="#000000" />
    </mask>

    <!-- Klippers til himmel over horisonten og gitter under horisonten -->
    <clipPath id="skyClip">
      <rect x="0" y="0" width="1920" height="738" />
    </clipPath>
    <clipPath id="floorClip">
      <rect x="0" y="738" width="1920" height="342" />
    </clipPath>
  </defs>

  <!-- 1. Dyb midnatslilla himmel -->
  <rect x="0" y="0" width="1920" height="742" fill="url(#skyGrad)" />
  <rect x="0" y="0" width="1920" height="742" fill="url(#horizonGlow)" />

  <!-- 2. Diskrete stjerner i den øvre himmel -->
  <g fill="#ffffff">
    <circle cx="115" cy="78" r="1.4" opacity="0.72" />
    <circle cx="218" cy="142" r="1.0" opacity="0.45" />
    <circle cx="294" cy="52" r="1.6" opacity="0.80" />
    <circle cx="378" cy="196" r="1.1" opacity="0.50" />
    <circle cx="445" cy="94" r="0.9" opacity="0.40" />
    <circle cx="512" cy="164" r="1.5" opacity="0.68" />
    <circle cx="586" cy="44" r="1.1" opacity="0.55" />
    <circle cx="642" cy="238" r="0.9" opacity="0.35" />
    <circle cx="710" cy="112" r="1.3" opacity="0.62" />
    <circle cx="764" cy="68" r="1.0" opacity="0.45" />
    <circle cx="842" cy="158" r="1.2" opacity="0.52" />
    <circle cx="918" cy="48" r="1.5" opacity="0.75" />
    <circle cx="998" cy="126" r="1.0" opacity="0.48" />
    <circle cx="1074" cy="74" r="1.3" opacity="0.65" />
    <circle cx="1148" cy="184" r="0.9" opacity="0.38" />
    <circle cx="1225" cy="56" r="1.6" opacity="0.82" />
    <circle cx="1292" cy="144" r="1.1" opacity="0.50" />
    <circle cx="1366" cy="96" r="1.4" opacity="0.70" />
    <circle cx="1442" cy="212" r="1.0" opacity="0.42" />
    <circle cx="1515" cy="62" r="1.2" opacity="0.60" />
    <circle cx="1596" cy="168" r="1.5" opacity="0.68" />
    <circle cx="1678" cy="88" r="1.0" opacity="0.45" />
    <circle cx="1744" cy="198" r="1.3" opacity="0.55" />
    <circle cx="1826" cy="72" r="1.5" opacity="0.78" />
    <circle cx="1872" cy="242" r="1.1" opacity="0.42" />
    <circle cx="164" cy="286" r="1.1" opacity="0.36" />
    <circle cx="332" cy="318" r="1.4" opacity="0.45" />
    <circle cx="486" cy="264" r="1.0" opacity="0.35" />
    <circle cx="624" cy="348" r="1.2" opacity="0.34" />
    <circle cx="1340" cy="310" r="1.3" opacity="0.38" />
    <circle cx="1498" cy="284" r="1.1" opacity="0.34" />
    <circle cx="1640" cy="336" r="1.4" opacity="0.42" />
    <circle cx="1788" cy="304" r="1.0" opacity="0.36" />
    <circle cx="88" cy="396" r="1.2" opacity="0.30" />
    <circle cx="418" cy="408" r="1.0" opacity="0.28" />
    <circle cx="1552" cy="392" r="1.1" opacity="0.28" />
    <circle cx="1845" cy="414" r="1.3" opacity="0.32" />
  </g>
  <!-- Enkelte svage cyan/magenta stjerner -->
  <g>
    <circle cx="268" cy="118" r="1.7" fill="#67e8f9" opacity="0.72" />
    <circle cx="695" cy="176" r="1.5" fill="#f472b6" opacity="0.60" />
    <circle cx="1040" cy="192" r="1.6" fill="#67e8f9" opacity="0.58" />
    <circle cx="1418" cy="134" r="1.8" fill="#f472b6" opacity="0.70" />
    <circle cx="1708" cy="132" r="1.6" fill="#a5f3fc" opacity="0.68" />
    <circle cx="534" cy="84" r="1.4" fill="#c084fc" opacity="0.62" />
    <circle cx="1186" cy="108" r="1.5" fill="#67e8f9" opacity="0.64" />
    <circle cx="884" cy="218" r="1.3" fill="#f472b6" opacity="0.48" />
  </g>

  <!-- 3. Segmenteret retro-solnedgang i midten (klippet over horisonten) -->
  <g clip-path="url(#skyClip)">
    <circle cx="960" cy="545" r="430" fill="url(#sunHalo)" />
    <circle cx="960" cy="545" r="275" fill="url(#sunGrad)" mask="url(#sunScanlineMask)" />
  </g>

  <!-- 4. To lag mørke bjergsilhuetter langs horisonten -->
  <!-- Bagerste bjergryg med svag neon-magenta kant -->
  <path
    d="M -20 738 L -20 558 L 95 512 L 210 582 L 345 486 L 478 594 L 592 544 L 705 636 L 818 672 L 960 698 L 1110 668 L 1228 622 L 1356 528 L 1482 586 L 1605 496 L 1732 574 L 1848 518 L 1940 552 L 1940 738 Z"
    fill="#120729"
    stroke="#ec4899"
    stroke-opacity="0.30"
    stroke-width="1.6"
    stroke-linejoin="round"
  />

  <!-- Forreste dybmørke bjergryg der indrammer solen -->
  <path
    d="M -20 738 L -20 622 L 128 574 L 246 642 L 388 560 L 520 648 L 635 618 L 758 688 L 875 718 L 960 726 L 1055 716 L 1175 680 L 1296 610 L 1418 652 L 1546 568 L 1680 636 L 1796 588 L 1940 632 L 1940 738 Z"
    fill="#060212"
  />

  <!-- 5. Synthwave-gulv & glødende 3D-perspektivgitter -->
  <g clip-path="url(#floorClip)">
    <rect x="0" y="738" width="1920" height="342" fill="url(#floorGrad)" />
    <rect x="0" y="738" width="1920" height="342" fill="url(#cyanHorizonGlow)" />

    <!-- Blød neon-bloom under gitteret (kun tykkere svag streg - ingen SVG blur-filtre) -->
    <g stroke="url(#gridColorGrad)" stroke-width="5" stroke-opacity="0.16" fill="none">
      <!-- Horisontale bloom-linjer -->
      <line x1="0" y1="744" x2="1920" y2="744" />
      <line x1="0" y1="752" x2="1920" y2="752" />
      <line x1="0" y1="764" x2="1920" y2="764" />
      <line x1="0" y1="781" x2="1920" y2="781" />
      <line x1="0" y1="804" x2="1920" y2="804" />
      <line x1="0" y1="835" x2="1920" y2="835" />
      <line x1="0" y1="876" x2="1920" y2="876" />
      <line x1="0" y1="929" x2="1920" y2="929" />
      <line x1="0" y1="996" x2="1920" y2="996" />
      <!-- Perspektivstråler bloom -->
      <line x1="960" y1="738" x2="960" y2="1080" />
      <line x1="960" y1="738" x2="1170" y2="1080" />
      <line x1="960" y1="738" x2="750" y2="1080" />
      <line x1="960" y1="738" x2="1390" y2="1080" />
      <line x1="960" y1="738" x2="530" y2="1080" />
      <line x1="960" y1="738" x2="1640" y2="1080" />
      <line x1="960" y1="738" x2="280" y2="1080" />
      <line x1="960" y1="738" x2="1940" y2="1080" />
      <line x1="960" y1="738" x2="-20" y2="1080" />
      <line x1="960" y1="738" x2="2320" y2="1080" />
      <line x1="960" y1="738" x2="-400" y2="1080" />
      <line x1="960" y1="738" x2="2820" y2="1080" />
      <line x1="960" y1="738" x2="-900" y2="1080" />
    </g>

    <!-- Skarpe gitterlinjer -->
    <g stroke="url(#gridVertFade)" stroke-width="1.35" stroke-opacity="0.72" fill="none">
      <!-- Eksponentielt fordelte horisontale linjer -->
      <line x1="0" y1="744" x2="1920" y2="744" />
      <line x1="0" y1="752" x2="1920" y2="752" />
      <line x1="0" y1="764" x2="1920" y2="764" />
      <line x1="0" y1="781" x2="1920" y2="781" />
      <line x1="0" y1="804" x2="1920" y2="804" />
      <line x1="0" y1="835" x2="1920" y2="835" />
      <line x1="0" y1="876" x2="1920" y2="876" />
      <line x1="0" y1="929" x2="1920" y2="929" />
      <line x1="0" y1="996" x2="1920" y2="996" />

      <!-- Perspektivstråler mod forsvindingspunkt (960, 738) -->
      <line x1="960" y1="738" x2="960" y2="1080" />
      <line x1="960" y1="738" x2="1170" y2="1080" />
      <line x1="960" y1="738" x2="750" y2="1080" />
      <line x1="960" y1="738" x2="1390" y2="1080" />
      <line x1="960" y1="738" x2="530" y2="1080" />
      <line x1="960" y1="738" x2="1640" y2="1080" />
      <line x1="960" y1="738" x2="280" y2="1080" />
      <line x1="960" y1="738" x2="1940" y2="1080" />
      <line x1="960" y1="738" x2="-20" y2="1080" />
      <line x1="960" y1="738" x2="2320" y2="1080" />
      <line x1="960" y1="738" x2="-400" y2="1080" />
      <line x1="960" y1="738" x2="2820" y2="1080" />
      <line x1="960" y1="738" x2="-900" y2="1080" />
      <line x1="960" y1="738" x2="3520" y2="1080" />
      <line x1="960" y1="738" x2="-1600" y2="1080" />
    </g>
  </g>

  <!-- 6. Glødende horisontlinje mellem himmel og gitter -->
  <line x1="0" y1="738" x2="1920" y2="738" stroke="#22d3ee" stroke-width="5" stroke-opacity="0.22" />
  <line x1="0" y1="738" x2="1920" y2="738" stroke="url(#horizonLineGrad)" stroke-width="2" />
</svg>
